<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Giannis hero poster (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="520" cy="220" r="420" fill="url(#glow)"/>
  <circle cx="1180" cy="260" r="360" fill="#a78bfa" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1040" cy="720" r="420" fill="#fbbf24" opacity="0.06" filter="url(#soft)"/>

  <!-- abstract silhouette -->
  <g opacity="0.95">
    <path d="M980 260c-40-58-96-92-174-92-116 0-210 90-210 202 0 78 40 142 102 178-52 62-86 138-98 224h416c-14-90-52-170-116-250 54-36 86-96 86-166 0-36-6-68-6-96z"
      fill="#0f1a33" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <path d="M640 690c60-20 120-36 180-36s122 14 184 36" fill="none" stroke="url(#grad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g font-family="Noto Sans SC, sans-serif">
    <text x="90" y="135" fill="#eaf0ff" font-size="62" font-weight="800">字母哥 · Giannis Antetokounmpo</text>
    <text x="90" y="195" fill="#a8b3d6" font-size="28">从雅典街头到 NBA 之巅｜离线可用海报（可替换为真实图片）</text>

    <g transform="translate(90 250)">
      <rect width="360" height="56" rx="28" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="22" y="37" fill="#eaf0ff" font-size="22" font-weight="700">标签：冠军 / MVP / DPOY / 两端统治</text>
    </g>

    <text x="90" y="820" fill="#a8b3d6" font-size="22">提示：把你自己的图片放到 assets/，然后在 index.html 里替换 img src 即可。</text>
  </g>
</svg>


